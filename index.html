/* body lab */
.org{cursor:pointer;transition:opacity .25s}.org.dim{opacity:.18}
#heartS{transform-box:fill-box;transform-origin:center;animation:beat var(--hb,0.75s) infinite}
.lung{transform-box:fill-box;transform-origin:center;animation:breathe var(--br,3s) ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.28)}30%{transform:scale(1)}}
@keyframes breathe{0%,100%{transform:scale(.92)}50%{transform:scale(1.1)}}
/* circuit */
.flow{fill:none;stroke:#f2b705;stroke-width:4;stroke-linecap:round;stroke-dasharray:2 14;animation:flow linear infinite}
@keyframes flow{to{stroke-dashoffset:-16}}
.air{fill:none;stroke:#9db7c4;stroke-width:2;stroke-dasharray:14 22;animation:air linear infinite}
@keyframes air{to{stroke-dashoffset:-36}}
.quake{animation:quake .16s linear infinite}
@keyframes quake{0%,100%{transform:translateX(0)}25%{transform:translateX(var(--qa))}75%{transform:translateX(calc(var(--qa) * -1))}}
.slot{cursor:pointer}

 ch:{t:'Build a Working Body-System Model',brief:'A science museum wants hands-on models that show visitors how one part of the body actually works. Design, build and test a model that MOVES or CHANGES to show an organ doing its job.',ideas:'A lung that inflates (bottle and balloons), a heart pump that moves "blood" (squeeze bottle, tubing, water), a hand with string tendons, or an arm with elastic muscles.',mat:'Recyclables, balloons, straws, string, elastics, tape, cardboard, water with food colouring.',crit:['My model shows a real organ or system doing its job','At least one part moves or changes when I operate it','I can name each part of the model and the real body part it represents','I tested my model, found a problem and improved it','I can explain one way my model is NOT like the real thing']}

C.u1[6]={
 big:'Life on Earth is incredibly varied, and that variety is what keeps ecosystems strong. When one strand of the web is pulled, the whole web moves.',
 goals:['describe what biodiversity is and classify organisms by their characteristics','explain how species depend on each other and how invasive species arrive and spread','investigate how an invasive species changes a food web','assess a local biodiversity issue and design a way to help'],
 vocab:[['Biodiversity','The variety of life: differences within a species, among species, and among ecosystems.'],['Species','A group of living things that are alike and can reproduce together.'],['Classification','Sorting living things into groups based on the characteristics they share.'],['Ecosystem','A community of living things interacting with each other and with their non-living surroundings.'],['Food web','A map of who eats whom. Arrows show the direction energy moves.'],['Producer','A living thing, such as a plant, that makes its own food using sunlight.'],['Decomposer','A living thing, such as a fungus or bacterium, that breaks down dead material and returns nutrients to the soil.'],['Invasive species','A species brought to a new place where it spreads and harms the environment, the economy or health.']],
 quiz:[{q:'Biodiversity means…',a:['the number of trees in a forest','the variety of living things in an area','how big an ecosystem is'],c:1,why:'It includes variety within species, among species and among ecosystems.'},
  {q:'In a food web, an arrow from an acorn to a chipmunk shows that…',a:['energy moves from the acorn to the chipmunk','the acorn eats the chipmunk','they live in the same tree'],c:0,why:'Arrows point from the food to the eater, following the energy.'},
  {q:'Which of these best describes an invasive species?',a:['Any animal that is dangerous','A native species that is rare','A non-native species that spreads and causes harm'],c:2,why:'Not every non-native species is invasive. It must spread and cause harm.'},
  {q:'Why is an ecosystem with high biodiversity usually more stable?',a:['It has more sunlight','If one species declines, others can fill a similar role','It has fewer predators'],c:1,why:'Variety gives an ecosystem back-up options when conditions change.'}],
 vids:[['How scientists sort living things','Food chains and food webs','Biodiversity and classification'],['Invasive species','Producers, consumers and decomposers','Interrelationships among species'],['Forest animals and their habitats','How changes ripple through an ecosystem','Invasive species in Ontario'],['Bees and other pollinators','Defining a problem and success criteria','Protecting biodiversity']],
 links:[["Ontario's Invading Species Awareness Program",'https://www.invadingspecies.com','Profiles of invaders found in Ontario and how to report them.'],['Invasive Species Centre','https://www.invasivespeciescentre.ca','Based in Sault Ste. Marie. Species profiles and maps.'],['Ontario Nature','https://ontarionature.org','Ontario habitats, species guides and conservation projects.'],["Hinterland Who's Who",'https://www.hww.ca','Fact sheets on Canadian wildlife.'],['Canadian Museum of Nature','https://nature.ca','Canada\'s national natural history museum.'],['Nature Conservancy of Canada','https://www.natureconservancy.ca','Protected places and species at risk across Canada.']],
 missions:[
  {t:'Schoolyard Species Sort',q:'How do scientists organize the huge variety of living things?',s:['List 12 living things you could find in or near your schoolyard.','Sort them into groups using characteristics you can observe (for example: has a backbone, makes its own food).','Compare with a partner. Did you use the same groups?'],p:'A classification chart or branching key for your 12 organisms.'},
  {t:'Invader File',q:'How does an invasive species arrive, spread and cause harm in Ontario?',s:['Choose one: emerald ash borer, garlic mustard, zebra mussel, round goby, phragmites or spongy moth.','Use the Ontario links below to find where it came from and how it got here.','Explain which native species it harms and how.','List two ways people can slow its spread.'],p:'A "Wanted" poster or a one-page species file.'},
  {t:'Forest Under Pressure',q:'How does one new species change a whole food web?',s:['Run the balanced forest for five years and record the Forest Health score.','Choose one invader. Predict which species will be affected first, second and third.','Run ten years. Record the populations at years 0, 5 and 10.','Use "Take action" and describe what recovers and what does not.'],p:'A data table and a cause-and-effect chain with at least four links.'},
  {t:'Biodiversity Action Plan',q:'What biodiversity issue matters in our community, and what can we do about it?',s:['Identify a local issue: an invasive plant, loss of pollinators, a mowed field, a new development.','Describe the issue from at least two points of view.','Propose one realistic action your class or school could take.','Explain how you would measure whether it worked.'],p:'An action plan to present to the principal, eco-club or school council.'}],
 ch:{t:'Design a Biodiversity Boost',brief:'Your school has a patch of plain lawn. Design a change to that space that would increase the number of native species living in or visiting it, then build a model or prototype of one part of your design.',ideas:'A native pollinator garden plan, a bee hotel, a bird-friendly feeder or nesting box, a log-and-leaf habitat pile, a mini wetland.',mat:'Grid paper, recyclables, cardboard, natural materials, craft supplies. Research native Ontario plants first.',crit:['My design uses native Ontario species, not invasive ones','I can name at least five species my design would help and explain how','My design shows producers, consumers and decomposers working together','I tested or got feedback on my prototype and improved it','I explained how the school would look after it']}

C.u2[5]={
 big:'Everything around you is matter, and all matter is made of tiny particles that are always moving. Add or remove heat and those particles behave very differently.',
 goals:['describe matter and compare the properties of solids, liquids and gases','tell the difference between physical and chemical changes','investigate how gaining or losing heat causes changes of state','assess how the materials and processes we use affect the environment'],
 vocab:[['Matter','Anything that has mass and takes up space.'],['Particle','One of the tiny pieces that all matter is made of. Particles are always moving.'],['Solid','Matter with a fixed shape and volume. Its particles are packed closely and vibrate in place.'],['Liquid','Matter with a fixed volume that takes the shape of its container. Its particles slide past each other.'],['Gas','Matter that spreads to fill any container. Its particles are far apart and move quickly.'],['Change of state','A change from one state of matter to another, caused by gaining or losing heat.'],['Physical change','A change in state, shape or size where no new substance is made. Many can be reversed.'],['Chemical change','A change that makes a new substance. Signs include a new colour, gas, smell, light or heat.']],
 quiz:[{q:'How do the particles in a solid behave?',a:['They fly around freely','They are packed closely and vibrate in place','They do not move at all'],c:1,why:'Particles never stop moving. In a solid they vibrate but stay in position.'},
  {q:'When a liquid is heated until it boils, its particles…',a:['gain energy, speed up and spread apart','get bigger','lose energy and slow down'],c:0,why:'Particles do not change size. They gain energy and escape from each other.'},
  {q:'Which of these is a chemical change?',a:['Ice melting','Paper being cut','Wood burning'],c:2,why:'Burning makes new substances: ash, smoke and gases.'},
  {q:'Water droplets forming on a cold window is…',a:['evaporation','condensation','melting'],c:1,why:'Water vapour in the air loses heat to the cold glass and becomes liquid.'}],
 vids:[['Solids, liquids and gases','What is matter? Particles','Properties of matter'],['Melting, freezing and evaporation','Physical and chemical changes','Changes of state'],['Why does ice melt?','Particles and changes of state','Thermal energy and matter'],['How insulation keeps things warm or cold','Testing and improving a design','Materials and manufacturing']],
 links:[[...LK.lts,'Canadian explainers on states of matter and at-home experiments.'],[...LK.ing,'Stories and activities from Canada\'s national science museums.'],[...LK.osc,'DIY science experiments you can do in a kitchen.'],[...LK.sn,'Sudbury\'s science centre, with teacher and student resources.'],['Environment and Climate Change Canada – Weather','https://weather.gc.ca','Spot changes of state in real forecasts: frost, fog, freezing rain.'],['Recycling Council of Ontario','https://rco.on.ca','What happens to materials after we use them.']],
 missions:[
  {t:'Matter Hunt',q:'How can I tell what state of matter something is in?',s:['Find 12 examples of matter at home or school: at least three solids, three liquids and three gases.','For each, record two properties you can observe (shape, volume, can it flow, can it be squeezed).','Circle one that was tricky to classify and explain why.'],p:'A sorted chart of 12 examples with properties.'},
  {t:'Kitchen Change Detective',q:'How do I know whether a change is physical or chemical?',s:['Watch a video from this stage and note the signs of a chemical change.','List six changes that happen in a kitchen (melting butter, toasting bread, dissolving sugar…).','Sort them into physical and chemical. Give your evidence for each.','Find one change of state that happens outdoors in an Ontario winter.'],p:'A two-column evidence chart.'},
  {t:'The Heating Curve',q:'What happens to particles and temperature as matter gains or loses heat?',s:['Predict: if you heat ice steadily, will the temperature rise steadily?','Heat the sample from –40 °C to 140 °C. Record the temperature, state and particle motion at six points.','Find the two places where the temperature stops rising. What is happening there?','Now cool it. Name each change of state you see.'],p:'A sketch of the heating curve with labels and a conclusion.'},
  {t:'Life of a Product',q:'What is the impact of making and throwing away the things we use?',s:['Choose a common product: plastic bottle, aluminum can, paper cup, glass jar or cotton T-shirt.','Research what it is made from and one process used to make it. Which changes are physical? Chemical?','Describe one effect on the environment and one on people.','Suggest an action that would reduce the harm.'],p:'A "life story" flow chart from raw material to disposal.'}],
 ch:{t:'Keep It Frozen',brief:'A shipping company needs to send frozen medicine without electricity. Design and build a container that keeps an ice cube solid for as long as possible.',ideas:'Think about which materials slow the movement of heat, how many layers to use, trapped air, colour, and how tightly it closes.',mat:'One ice cube per test, a small cup or box, foil, cotton, newspaper, bubble wrap, fabric, foam, tape, a timer and a scale or measuring cylinder.',crit:['My container is no bigger than the size limit our class agreed on','I chose materials because of their properties and can explain why','I ran a fair test against an ice cube with no container','I measured how much melted and recorded it','I changed one thing and tested again to improve my design']}
};
C.u2[6]={
 big:'Electricity is energy on the move. When we give it a complete path, we can turn it into light, heat, sound and motion.',
 goals:['explain static electricity and compare it with current electricity','describe how electricity is generated and transformed, and what that costs society and the environment','build and compare series and parallel circuits','design a device that uses a circuit and plan how to use electricity responsibly'],
 vocab:[['Static electricity','A build-up of electric charge on the surface of an object. It stays put until it jumps.'],['Current electricity','A steady flow of electric charge through a path.'],['Circuit','A complete loop that electricity can travel around, from the source and back again.'],['Conductor','A material that lets electricity flow easily, such as copper or aluminum.'],['Insulator','A material that does not let electricity flow easily, such as rubber, plastic or glass.'],['Series circuit','A circuit with only one path. Every part is on the same loop.'],['Parallel circuit','A circuit with more than one path. Each branch gets its own route to the source.'],['Switch','A device that opens or closes a gap in a circuit to stop or start the flow.']],
 quiz:[{q:'What does current electricity need in order to flow?',a:['A complete, closed loop','A very long wire','An open switch'],c:0,why:'A gap anywhere in the loop stops the flow.'},
  {q:'In a series circuit with three bulbs, one bulb is removed. What happens?',a:['The others get brighter','All the bulbs go out','Nothing changes'],c:1,why:'There is only one path, so a gap anywhere breaks the whole circuit.'},
  {q:'Why are the lights in a home wired in parallel?',a:['It uses less wire','So each light can work on its own','So they all turn off together'],c:1,why:'Each branch has its own path, so one light can be off while others stay on.'},
  {q:'Which material is a good conductor?',a:['Rubber','Glass','Copper'],c:2,why:'Metals let charge flow easily, which is why wires are copper inside and plastic outside.'}],
 vids:[['Static electricity','How energy changes form','Static and current electricity'],['Where does electricity come from?','Renewable and non-renewable energy','Generating electricity in Canada'],['How circuits work','Circuits and energy transfer','Series and parallel circuits'],['How batteries work','The engineering design process','Conserving electrical energy']],
 links:[['IESO – Ontario\'s Power Data','https://www.ieso.ca','See where Ontario\'s electricity is coming from right now: nuclear, hydro, wind, solar, gas.'],['Ontario Power Generation','https://www.opg.com','How Ontario\'s hydro and nuclear stations make electricity.'],['Electrical Safety Authority (Ontario)','https://esasafe.com','Staying safe around electricity at home and outdoors.'],['Hydro One','https://www.hydroone.com','How power travels across Ontario and ways to save energy.'],[...LK.lts,'Canadian explainers on circuits and energy.'],[...LK.ing,'Energy and technology stories from Canada\'s national museums.']],
 missions:[
  {t:'Static or Current?',q:'How are static and current electricity alike and different?',s:['Flip every vocabulary card. Sort the words into "static", "current" or "both".','Try it: rub a balloon on your hair or a sweater, then bring it near small bits of paper. Record what happens.','List six classroom objects and predict whether each is a conductor or an insulator.'],p:'A Venn diagram comparing static and current electricity.'},
  {t:'Ontario Power Tracker',q:'Where does our electricity come from, and what does it cost the planet?',s:['Use the IESO link below to find Ontario\'s energy sources today.','Choose two sources (for example nuclear and wind). What form of energy does each one start with?','For each, describe one benefit and one cost to people or the environment, including the communities living nearby.','Decide: which source should Ontario use more of? Defend your choice.'],p:'A comparison chart and a short persuasive paragraph.'},
  {t:'Circuit Builder Lab',q:'How does the way a circuit is connected change what it does?',s:['Build a series circuit with two bulbs. Record brightness and current.','Build a parallel circuit with two bulbs. Record brightness and current.','In each circuit, remove one bulb. What happens to the other?','Add a second cell. What changes?'],p:'Two labelled circuit diagrams and a comparison table.'},
  {t:'Energy Audit',q:'How can our class use less electricity?',s:['List every device in your classroom that uses electricity. What does each one transform electrical energy into?','Observe for one day: which devices are left on when nobody is using them?','Choose three realistic changes and estimate which would save the most.','Create a way to convince other classes to join in.'],p:'An audit report and an advocacy poster or announcement.'}],
 ch:{t:'Wire a Model Room',brief:'An architect has asked you to wire the lighting for a model room. The client wants two lights that can be switched on and off separately, and both must be as bright as possible.',ideas:'Decide whether series or parallel wiring meets the client\'s needs. Test your plan in the Circuit Builder before you build. You could add a buzzer doorbell or a fan.',mat:'A shoebox, AA batteries and holder, small bulbs or LEDs, insulated wire or foil strips, paper clips and brass fasteners for switches, tape. Batteries only. Never use a wall outlet.',crit:['Both lights turn on','Each light has its own working switch','I can explain why I chose series or parallel wiring','I drew a circuit diagram that matches what I built','I found a problem while testing and fixed it']}
};

osers","herbivores"],2316513558],["Which best describes an invasive species?",["Any plant in a garden","A native species that is endangered","Any animal that migrates","A non-native species that spreads and causes harm"],2316510422],["How does the emerald ash borer harm Ontario forests?",["It eats acorns","Its larvae tunnel under the bark of ash trees","It scares away birds","It eats maple leaves"],2316511511],["Which is a way people accidentally spread invasive species?",["Moving firewood from one area to another","Planting native wildflowers","Recycling paper","Walking to school"],2316508375]],"fin":[["In a food web, the arrows show…",["which animal is bigger","the direction energy moves","where animals sleep","which species are invasive"],203504720],["Which shows the correct direction of energy flow?",["Fox → chipmunk → acorn","Acorn → chipmunk → fox","Chipmunk → acorn → fox","Fox → acorn → chipmunk"],203507857],["In the simulator, native insects declined after ash trees declined because…",["they lost one of their food sources","the weather got colder","owls ate them all","they moved to another forest"],203502675],["Garlic mustard reduces biodiversity mainly by…",["eating deer","attracting wolves","crowding out native wildflowers on the forest floor","knocking down trees"],203505808],["When wolves disappeared in the simulator…",["deer decreased and plants increased","nothing changed","every population increased","deer increased and the plants they eat decreased"],203509078],["Why is variety within a single species important?",["Some individuals may survive a change that kills others","It makes them easier to classify","It makes them all the same size","It stops them from reproducing"],203512212],["A tree-killing insect arrives. Which forest is more likely to stay healthy?",["A forest with one tree species, because it is simpler","Both are affected equally","A forest with many tree species, because other trees remain","Neither is affected"],203507029],["Which is a  const P0=0.225;
 ['s1','s2'].forEach(s=>{if(slots[s]==='bulb')out.pct[s]=Math.round(out.I*out.I*10/P0*100)});
 ['a','b','c'].forEach(k=>[k+'1',k+'2'].forEach(s=>{if(slots[s]==='bulb')out.pct[s]=Math.round(out.ib[k]*out.ib[k]*10/P0*100)}));
 const serB=['s1','s2'].filter(s=>slots[s]==='bulb').length;
 const brB=['a','b','c'].filter(k=>out.ib[k]>0&&(slots[k+'1']==='bulb'||slots[k+'2']==='bulb')).length;
 const nb=Object.values(out.pct).filter(p=>p>0).length;
 out.serB=serB;out.brB=brB;out.lit=nb;
 const flowing=['a','b','c'].filter(k=>out.ib[k]>0).length;
 if(flowing>=2&&brB>=2)out.type=serB?'Combination circuit: bulbs in series AND on parallel branches':'Parallel circuit: the current splits along '+flowing+' paths';
 else if(flowing===1)out.type=nb>=2?'Series circuit: one path through every bulb':'Simple circuit: one path, one load';
 else out.type='One loop with a branch that has no bulb';
 return out;
}

function labMatter(el){
 el.innerHTML='<h3>Lab: Particle View of Heating and Cooling</h3><p class="note">You are looking at a tiny sample of water, magnified millions of times. Add or remove heat and watch the particles.</p><div class="lab"><div><canvas id="mcv" width="380" height="300" role="img" aria-label="Animated particles in a container"></canvas></div><div>'+
 '<div class="row"><button class="btn sm" data-m="1">🔥 Heat</button><button class="btn sm ghost" data-m="0">Pause</button><button class="btn sm" data-m="-1" style="background:#2e6fb0;border-color:#2e6fb0">❄ Cool</button><button class="btn sm ghost" id="mrec">Record this moment</button></div>'+
 '<label for="me"><b>Thermal energy in the sample</b></label><input type="range" id="me" min="0" max="280" step="1" value="10"><div class="scale"><span>less</span><span>more</span></div>'+
 '<div class="read"><div><small>Temperature</small><b id="mt"></b> °C</div><div><small>State</small><b id="ms" style="font-size:1rem"></b></div><div><small>Heat is</small><b id="mh" style="font-size:1rem"></b></div></div>'+
 '<div class="alert info" id="mdesc" aria-live="polite"></div>'+
 '<svg id="mch" viewBox="0 0 300 170" role="img" aria-label="Heating curve: temperature against thermal energy"><line x1="34" y1="150" x2="290" y2="150" stroke="#8a9a94"/><line x1="34" y1="10" x2="34" y2="150" stroke="#8a9a94"/>'+
 '<line x1="34" y1="120" x2="290" y2="120" stroke="#d9d0bd" stroke-dasharray="3 3"/><line x1="34" y1="45" x2="290" y2="45" stroke="#d9d0bd" stroke-dasharray="3 3"/><text x="6" y="123" font-size="9">0 °C</text><text x="2" y="48" font-size="9">100 °C</text><text x="110" y="165" font-size="9">Thermal energy added →</text>'+
 '<polyline fill="none" stroke="#bd5417" stroke-width="2.5" points="34,150 70.6,120 107.1,120 198.6,45 253.4,45 290,15"/><circle id="mdot" r="6" fill="#17312c"/></svg>'+
 '<p class="note">Model of water at normal air pressure. Real particles are far too small and too many to see.</p></div></div>';
 const desc=$('#mdesc',el);
 const cv=$('#mcv',el),g=cv.getContext('2d'),N=40,P=[];let E=10,mode=0,last=0;
 for(let i=0;i<N;i++){const r=Math.floor(i/8),c=i%8,hx=190+(c-3.5)*17,hy=270-r*16;P.push({x:hx,y:hy,hx,hy,vx:0,vy:0})}
 const ph=i=>E<40?0:E<80?(i>=N*(1-(E-40)/40)?1:0):E<180?1:E<240?(i>=N*(1-(E-180)/60)?2:1):2;
 function tick(ts){
  if(!cv.isConnected)return;
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  if(mode){E=clamp(E+mode*22*dt,0,280);$('#me',el).value=E;if(E<=0||E>=280)mode=0}
  const T=matterT(E),A=1+(T+40)/40*2.2;
  for(let i=0;i<N;i++){const p=P[i],s=ph(i);
   if(s===0){p.x+=(p.hx+(Math.random()-.5)*A*2-p.x)*.3;p.y+=(p.hy+(Math.random()-.5)*A*2-p.y)*.3;p.vx=p.vy=0}
   else if(s===1){const sp=1+Math.max(0,T)/100*1.2;p.vx+=(Math.random()-.5)*.5;p.vy+=(Math.random()-.5)*.5+.12;if(p.y<205)p.vy+=.35;
     const v=Math.hypot(p.vx,p.vy);if(v>sp){p.vx*=sp/v;p.vy*=sp/v}p.x+=p.vx;p.y+=p.vy}
   else{const sp=2.6+Math.max(0,T-100)/40*2;let v=Math.hypot(p.vx,p.vy);if(v<.3){const a=Math.random()*6.28;p.vx=Math.cos(a);p.vy=Math.sin(a);v=1}
     p.vx*=sp/v;p.vy*=sp/v;p.x+=p.vx;p.y+=p.vy}
   if(p.x<28){p.x=28;p.vx=Math.abs(p.vx)}if(p.x>352){p.x=352;p.vx=-Math.abs(p.vx)}if(p.y<28){p.y=28;p.vy=Math.abs(p.vy)}if(p.y>272){p.y=272;p.vy=-Math.abs(p.vy)}}
  for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){const a=P[i],b=P[j];if(ph(i)===2||ph(j)===2)continue;if(ph(i)===0&&ph(j)===0)continue;
   const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.01;if(d<15){const k=(15-d)/2/d;if(ph(i)===1){a.x-=dx*k;a.y-=dy*k}if(ph(j)===1){b.x+=dx*k;b.y+=dy*k}}}
  g.clearRect(0,0,380,300);g.fillStyle=mode>0?'#f6c9a8':mode<0?'#bcd9f2':'#e6e0d0';g.fillRect(14,284,352,10);
  g.strokeStyle='#17312c';g.lineWidth=3;g.strokeRect(18,18,344,264);
  const hue=210-clamp((T+40)/180,0,1)*200;

  const melt=E>=40&&E<80,boil=E>=180&&E<240;
  $('#mt',el).textContent=Math.round(T);
  $('#ms',el).textContent=melt?'Solid + liquid':boil?'Liquid + gas':E<40?'Solid (ice)':E<180?'Liquid (water)':'Gas (water vapour)';

  desc.innerHTML=melt?'<b>'+(mode<0?'Freezing':'Melting')+' at 0 °C.</b> The temperature stays the same because the energy is being used to '+(mode<0?'lock particles back into fixed positions':'pull particles out of their fixed positions')+'.':
   boil?'<b>'+(mode<0?'Condensation':'Boiling (evaporation)')+' at 100 °C.</b> The temperature stays the same while particles '+(mode<0?'slow down and gather back together':'break free from each other completely')+'.':
   E<40?'<b>Solid.</b> Particles are packed in a regular pattern. They vibrate in place'+(T>-15?', and the vibration is getting stronger.':'.'):
   E<180?'<b>Liquid.</b> Particles are still close together but can slide past each other, so the liquid takes the shape of its container.':
   '<b>Gas.</b> Particles are far apart and move fast in every direction, filling the whole container.';
  $('#mdot',el).setAttribute('cx',34+E/280*256);$('#mdot',el).setAttribute('cy',120-T*0.75);
  requestAnimationFrame(tick);

const HS={clim:{cold:['Cold winters (Ontario, 1970s)',75,238],today:['Today',88,222],warm:['Much warmer winters',106,204],grad:['Gradual warming',75,238]},vary:{low:['Low',3],med:['Medium',8],high:['High',16]},MAX:60};
function hareSnow(st){if(st.clim!=='grad')return HS.clim[st.clim].slice(1);const k=Math.min(1,st.year/25);return[Math.round(75+31*k),Math.round(238-34*k)]}

function hareMis(x,s){return Math.abs(x.w-s[0])+Math.abs(x.b-s[1])}

 let next=surv.concat(kids);while(next.length>HS.MAX)next.splice(Math.floor(r()*next.length),1);
 st.h=surv.length?next:[];st.year++;st.hist.push({pop:st.h.length,mis:st.h.length?Math.round(st.h.reduce((a,x)=>a+hareMis(x,hareSnow(st)),0)/st.h.length):0,surv:surv.length,before:surv.length+st.dead.length,avgMis:Math.round(tm/(surv.length+st.dead.length||1))});return st}

  ['Sep','Dec','Mar','Jun'].forEach((m,i)=>h+='<text x="'+(10+i*75)+'" y="85" font-size="9" fill="#586a64">'+m+'</text>');h+='<text x="10" y="102" font-size="9" fill="#586a64">Red bars: spread of turn-white and turn-brown dates (variation).</text>';
